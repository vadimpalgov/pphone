<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pPhone</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jssip@3/dist/jssip.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginScreen" class="d-flex align-items-center justify-content-center vh-100">
  <div class="card shadow-sm p-4 w-100" style="max-width: 360px;">
    <div class="text-center mb-3">
      <i class="bi bi-telephone-fill fs-1 text-primary"></i>
      <h4 class="mt-2 mb-0">pPhone</h4>
      <div class="text-secondary small">вход в учётную запись</div>
    </div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label small text-secondary">Номер</label>
        <input id="loginExt" class="form-control" placeholder="1001" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label small text-secondary">Пароль</label>
        <input id="loginPass" type="password" class="form-control" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Войти</button>
    </form>
    <div id="loginError" class="text-danger small mt-2 text-center"></div>
  </div>
</div>

<div id="mainScreen" class="d-none min-vh-100 d-flex flex-column">
  <nav class="navbar navbar-dark bg-primary px-3 flex-shrink-0">
    <span class="navbar-brand mb-0 h5"><i class="bi bi-telephone-fill me-2"></i>pPhone — <span id="myExt"></span></span>
    <div class="d-flex align-items-center gap-2">
      <span id="statusBadge" class="badge rounded-pill bg-secondary">...</span>
      <button id="logoutBtn" class="btn btn-sm btn-outline-light" aria-label="Выйти"><i class="bi bi-box-arrow-right"></i></button>
    </div>
  </nav>

  <div class="container flex-grow-1 py-3" style="max-width: 480px;">
    <div class="card mb-3">
      <div class="card-header fw-semibold small text-uppercase text-secondary">Абоненты</div>
      <div id="contactsList" class="list-group list-group-flush"></div>
    </div>

    <div class="card">
      <div class="card-header fw-semibold small text-uppercase text-secondary d-flex align-items-center justify-content-between">
        <span>Транскрипция звонка</span>
        <button id="clearTranscriptBtn" class="btn btn-sm btn-outline-secondary py-0 px-2" aria-label="Очистить">Очистить</button>
      </div>
      <div id="transcript" class="card-body transcript-body"></div>
    </div>
  </div>

  <div style="height: 88px;" class="flex-shrink-0"></div>

  <audio id="remoteAudio" autoplay></audio>
</div>

<div id="incomingOverlay" class="call-overlay d-none">
  <div class="card text-center p-4 shadow-lg call-card">
    <i class="bi bi-telephone-inbound fs-1 text-success mb-2 ringing-icon"></i>
    <div class="fs-5 fw-semibold" id="incomingFrom">...</div>
    <div class="text-secondary small mb-3">входящий звонок</div>
    <div class="d-flex justify-content-around">
      <button id="declineBtn" class="btn btn-danger rounded-circle call-btn" aria-label="Отклонить"><i class="bi bi-telephone-x-fill"></i></button>
      <button id="acceptBtn" class="btn btn-success rounded-circle call-btn" aria-label="Принять"><i class="bi bi-telephone-fill"></i></button>
    </div>
  </div>
</div>

<div id="activeCallBar" class="active-call-bar d-none">
  <div>
    <div class="fw-semibold" id="activeCallWith">...</div>
    <div class="small opacity-75" id="activeCallState">...</div>
  </div>
  <button id="hangupBtn" class="btn btn-danger rounded-circle call-btn" aria-label="Завершить"><i class="bi bi-telephone-x-fill"></i></button>
</div>

<script src="app.js"></script>
</body>
</html>
