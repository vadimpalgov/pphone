[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088
; внутри контейнера Asterisk видит только свои docker-IP (172.x) и рекламирует
; их как ICE host-кандидаты — браузер снаружи до них не достучится. Подменяем
; на публичный IP сервера для всего, что не входит в приватные docker-сети.
external_media_address=161.104.44.145
external_signaling_address=161.104.44.145
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---- 1001 (web client, WebRTC) ----
[1001]
type=endpoint
context=internal
disallow=all
allow=ulaw
webrtc=yes
dtls_cert_file=/etc/asterisk/keys/asterisk.pem
dtls_private_key=/etc/asterisk/keys/asterisk.pem
dtls_verify=no
dtls_setup=actpass
auth=1001-auth
aors=1001
transport=transport-ws

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=1001secret

[1001]
type=aor
max_contacts=1
remove_existing=yes

; ---- 1002 (web client, WebRTC) ----
[1002]
type=endpoint
context=internal
disallow=all
allow=ulaw
webrtc=yes
dtls_cert_file=/etc/asterisk/keys/asterisk.pem
dtls_private_key=/etc/asterisk/keys/asterisk.pem
dtls_verify=no
dtls_setup=actpass
auth=1002-auth
aors=1002
transport=transport-ws

[1002-auth]
type=auth
auth_type=userpass
username=1002
password=1002secret

[1002]
type=aor
max_contacts=1
remove_existing=yes

; ---- bot (headless SIP UA, plain RTP, no WebRTC) ----
[bot]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=bot-auth
aors=bot
transport=transport-udp

[bot-auth]
type=auth
auth_type=userpass
username=bot
password=botsecret

[bot]
type=aor
max_contacts=1
remove_existing=yes
