[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

; AMI слушает только на docker backend-сети (порт не публикуется в
; docker-compose), нужен боту-транскрайберу исключительно чтобы ловить
; ConfbridgeJoin/ConfbridgeLeave и резать запись звонка по границам
; "в комнате только бот" <-> "в комнате есть хотя бы один абонент".
[transcriber]
secret = amisecret
deny = 0.0.0.0/0
permit = 172.16.0.0/12
read = all
write = all
