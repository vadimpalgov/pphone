[general]
rtpstart=10000
rtpend=10200
icesupport=yes

; external_media_address в pjsip.conf переписывает только SIP/SDP-уровень,
; а сами ICE host-кандидаты генерирует RTP-движок на основе своих локальных
; docker-адресов (172.x) — их браузер снаружи не достанет. Явно подменяем
; на публичный IP сервера.
; синтаксис — ровно "<локальный IP> => <внешний IP>" (CIDR не поддерживается),
; поэтому перечисляем по отдельности оба docker-интерфейса контейнера
; (traefik-сеть и backend-сеть). При пересоздании контейнера docker обычно
; выдаёт те же адреса повторно, но если сеть поменяется - подправить тут.
[ice_host_candidates]
172.21.0.2 => 161.104.44.145
172.18.0.8 => 161.104.44.145
