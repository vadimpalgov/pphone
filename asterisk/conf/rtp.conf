[general]
rtpstart=10000
rtpend=10200
icesupport=yes

; external_media_address в pjsip.conf переписывает только SIP/SDP-уровень,
; а сами ICE host-кандидаты генерирует RTP-движок на основе своих локальных
; docker-адресов (172.x) — их браузер снаружи не достанет. Явно подменяем
; на публичный IP сервера.
; синтаксис — ровно "<локальный IP> => <внешний IP>" (CIDR не поддерживается).
; Статически прописанные здесь IP ломались при каждом пересоздании
; контейнера, т.к. docker не гарантирует тот же адрес повторно (именно
; так и случилось - IP в traefik-сети сменился, маппинг разошёлся с
; реальностью, и браузер получал недостижимый internal IP как
; ICE-кандидат, что сразу роняло ICE/STUN). Поэтому сами адреса не
; прописаны тут, а генерируются entrypoint.sh при каждом старте
; контейнера в ice_host_candidates.conf.
#include ice_host_candidates.conf
