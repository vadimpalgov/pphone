[general]
rtpstart=10000
rtpend=10200
icesupport=yes

; external_media_address в pjsip.conf переписывает только SIP/SDP-уровень,
; а сами ICE host-кандидаты генерирует RTP-движок на основе своих локальных
; docker-адресов (172.x) — их браузер снаружи не достанет. Явно подменяем
; на публичный IP сервера.
[ice_host_candidates]
172.16.0.0/255.240.0.0 => 161.104.44.145
