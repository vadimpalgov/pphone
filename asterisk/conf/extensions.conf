[general]
static=yes
writeprotect=no

[globals]

[internal]
; реальный вызов: звонящий ставится в ring на вызываемого; когда тот отвечает,
; G() переводит ОБА плеча в confjoin -> оба попадают в общую ConfBridge,
; где уже сидит бот (слушает через exten 9000)
exten => _1XXX,1,NoOp(Dialing ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20,G(ringresult^1))
 same => n,Hangup()

exten => ringresult,1,Goto(confjoin,1)
 same => n,Goto(confjoin,1)

exten => confjoin,1,ConfBridge(demo_room,default_bridge,default_user)

exten => 9000,1,NoOp(bot -> demo_room)
 same => n,ConfBridge(demo_room,default_bridge,default_user)
