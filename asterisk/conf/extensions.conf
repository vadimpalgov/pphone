[general]
static=yes
writeprotect=no

[globals]

[internal]
; любой звонок на 1001 или 1002 заводит в общую confbridge-комнату;
; бот (транскрайбер) заходит туда же через фиксированный exten 9000
exten => 1001,1,NoOp(-> demo_room)
 same => n,ConfBridge(demo_room,default_bridge,default_user)

exten => 1002,1,NoOp(-> demo_room)
 same => n,ConfBridge(demo_room,default_bridge,default_user)

exten => 9000,1,NoOp(bot -> demo_room)
 same => n,ConfBridge(demo_room,default_bridge,default_user)
