services:
  asterisk:
    build: ./asterisk
    container_name: pphone-asterisk
    restart: unless-stopped
    ports:
      - "10000-10200:10000-10200/udp"
    networks:
      - traefik
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pphone-sip.entrypoints=websecure"
      - "traefik.http.routers.pphone-sip.rule=Host(`pphone-sip.parfeon.ru`)"
      - "traefik.http.routers.pphone-sip.tls.certresolver=letsencrypt"
      - "traefik.http.services.pphone-sip.loadbalancer.server.port=8088"

  transcriber:
    build: ./transcriber
    container_name: pphone-transcriber
    restart: unless-stopped
    depends_on:
      - asterisk
    environment:
      SIP_DOMAIN: asterisk
      BOT_USER: bot
      BOT_PASS: botsecret
      JOIN_EXTEN: "9000"
      WHISPER_MODEL: base
    networks:
      - traefik
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pphone-transcribe.entrypoints=websecure"
      - "traefik.http.routers.pphone-transcribe.rule=Host(`pphone-transcribe.parfeon.ru`)"
      - "traefik.http.routers.pphone-transcribe.tls.certresolver=letsencrypt"
      - "traefik.http.services.pphone-transcribe.loadbalancer.server.port=8765"

  webclient:
    build: ./webclient
    container_name: pphone-webclient
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pphone-web.entrypoints=websecure"
      - "traefik.http.routers.pphone-web.rule=Host(`pphone.parfeon.ru`)"
      - "traefik.http.routers.pphone-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.pphone-web.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
  backend:
    driver: bridge
